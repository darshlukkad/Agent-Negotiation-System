name: Eval Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  eval-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify eval set hash
        run: |
          echo "Checking eval_set.jsonl hash..."
          python eval_gate.py --hash
          COMPUTED_HASH=$(python -c "import hashlib; print(hashlib.sha256(open('eval_set.jsonl', 'rb').read()).hexdigest())")
          MANIFEST_HASH=$(python -c "import json; print(json.load(open('manifest.json'))['eval_set_hash'])")
          if [ "$COMPUTED_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: Hash mismatch!"
            echo "Computed: $COMPUTED_HASH"
            echo "Manifest: $MANIFEST_HASH"
            exit 1
          fi
          echo "Hash verified: $COMPUTED_HASH"

      - name: Run eval gate
        run: |
          python eval_gate.py --gate
        env:
          USE_LLM: "false"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            baseline.json
            manifest.json
